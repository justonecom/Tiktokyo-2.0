<!DOCTYPE html>
<html lang="ceb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTokyo 2.0 HD - Fixed CORS</title>
    <!-- FontAwesome para sa TikTok Logo ug mga Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 16px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #222;
            margin-bottom: 16px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo i {
            font-size: 24px;
            color: #ffffff;
        }
        .logo-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }
        .logo-sub {
            font-size: 10px;
            color: #888;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .badge {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        select, input {
            background: #000;
            color: #fff;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        select:focus, input:focus {
            border-color: #fff;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid #222;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: #777;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .tab-btn.active {
            color: #fff;
            border-bottom-color: #fff;
        }
        .card {
            background: #121212;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .title {
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 14px;
        }
        .input-wrapper input {
            padding-right: 75px;
        }
        .paste-btn {
            position: absolute;
            right: 8px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .paste-btn:active {
            background: #444;
        }
        .btn-main {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-main:active {
            opacity: 0.8;
        }
        .btn-sec {
            background: #000;
            color: #fff;
            border: 1px solid #333;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-top: 8px;
            text-transform: uppercase;
        }
        .quality-box {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #222;
            margin-bottom: 14px;
        }
        .quality-label {
            font-size: 11px;
            color: #aaa;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        video {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            background: #000;
            border: 1px solid #222;
            margin-bottom: 12px;
        }
        .status {
            text-align: center;
            padding: 12px;
            font-size: 12px;
            color: #aaa;
            background: #000;
            border-radius: 8px;
            border: 1px solid #222;
            display: none;
            margin-top: 12px;
        }
        .hidden { display: none !important; }
        footer {
            margin-top: auto;
            text-align: center;
            font-size: 10px;
            color: #555;
            padding: 16px 0;
            border-top: 1px solid #111;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <i class="fa-brands fa-tiktok"></i>
            <div>
                <div class="logo-title">TikTokyo 2.0</div>
                <div class="logo-sub">B&W HD EDITION</div>
            </div>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
            <span class="badge">B&W 2.0</span>
            <select id="lang-select" onchange="changeLanguage(this.value)" style="width: auto; padding: 6px 10px; font-size: 11px;">
                <option value="ceb">CEB</option>
                <option value="tag">TAG</option>
                <option value="eng">ENG</option>
            </select>
        </div>
    </header>

    <!-- TABS -->
    <div class="tabs">
        <button id="tab-dl" class="tab-btn active" onclick="switchTab('downloader')">DOWNLOADER</button>
        <button id="tab-his" class="tab-btn" onclick="switchTab('history')">HISTORY</button>
    </div>

    <!-- MAIN DOWNLOADER -->
    <div id="sec-downloader">
        <div class="title" data-i18n="hero_title">TikTok Downloader</div>
        <div class="subtitle" data-i18n="hero_desc">Walay watermark. Full Original FPS & HD Resolution direct sa Gallery.</div>

        <div class="card">
            <form onsubmit="handleUrlExtract(event)">
                <label style="font-size: 11px; color: #aaa; font-weight: bold; display: block; margin-bottom: 6px;" data-i18n="label_paste">PASTE TIKTOK LINK:</label>
                
                <div class="input-wrapper">
                    <input type="url" id="tiktok-url-input" required placeholder="https://vt.tiktok.com/...">
                    <button type="button" class="paste-btn" onclick="pasteClipboard()">
                        <i class="fa-regular fa-clipboard"></i> <span data-i18n="btn_paste">PASTE</span>
                    </button>
                </div>
                
                <div class="quality-box">
                    <label class="quality-label" data-i18n="quality_label">QUALITY & FPS CHOICE:</label>
                    <select id="quality-selector">
                        <option value="hd">Ultra HD 1080p / 60 FPS (Original)</option>
                        <option value="sd">Standard HD 720p</option>
                        <option value="low">Data Saver 480p</option>
                    </select>
                </div>

                <button type="submit" class="btn-main" data-i18n="btn_extract">PROCESS VIDEO</button>
            </form>

            <div id="extraction-status" class="status" data-i18n="status_processing">
                Giproseso ang HD video... Hulat kadiyot.
            </div>
        </div>

        <!-- RESULT CARD -->
        <div id="result-card" class="card hidden">
            <video id="res-video-player" controls preload="metadata"></video>
            
            <div style="font-size: 12px; color: #888; font-weight: bold; margin-bottom: 4px;" id="res-author">@username</div>
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 14px;" id="res-title">Video Title</div>

            <button onclick="triggerDirectDownload('video')" class="btn-main" data-i18n="dl_video">DOWNLOAD MP4 VIDEO</button>
            <button onclick="triggerDirectDownload('audio')" class="btn-sec" data-i18n="dl_audio">DOWNLOAD MP3 AUDIO</button>
        </div>
    </div>

    <!-- HISTORY SECTION -->
    <div id="sec-history" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span style="font-weight: bold; font-size: 14px;" data-i18n="history_title">MGA NA-DOWNLOAD</span>
            <button onclick="clearDownloadHistory()" style="background: none; border: none; color: #888; font-size: 11px; cursor: pointer;" data-i18n="clear_history">Clear History</button>
        </div>
        <div id="history-container"></div>
        <div id="history-empty" style="text-align: center; color: #555; padding: 40px 0; font-size: 13px;" data-i18n="empty_history">Wala pa'y na-download.</div>
    </div>

    <!-- FOOTER -->
    <footer>
        TikTokyo 2.0 B&W HD Edition &copy; 2026. All rights reserved.
    </footer>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1563880559246188658/0JVRYmS4GCbeRwGupzlHzrjE4rKgjAweRE-X2bjurR2q8_ko1D0u8O6yv6dLLk3s9wEv";

        let userIdentifier = localStorage.getItem('tkt_user_id');
        if (!userIdentifier) {
            userIdentifier = 'User_' + Math.random().toString(36).substring(2, 8).toUpperCase();
            localStorage.setItem('tkt_user_id', userIdentifier);
        }

        const i18n = {
            ceb: {
                hero_title: "TikTok Downloader",
                hero_desc: "Walay watermark. Full Original FPS & HD Resolution direct sa Gallery.",
                label_paste: "PASTE TIKTOK LINK:",
                btn_paste: "PASTE",
                quality_label: "QUALITY & FPS CHOICE:",
                btn_extract: "PROCESS VIDEO",
                status_processing: "Giproseso ang HD video... Hulat kadiyot.",
                dl_video: "DOWNLOAD MP4 (MAX QUALITY)",
                dl_audio: "DOWNLOAD MP3 AUDIO",
                history_title: "MGA NA-DOWNLOAD",
                clear_history: "I-clear History",
                empty_history: "Wala pa'y na-download."
            },
            tag: {
                hero_title: "TikTok Downloader",
                hero_desc: "Walang watermark. Original FPS & HD Resolution diretso sa Gallery.",
                label_paste: "I-PASTE ANG TIKTOK LINK:",
                btn_paste: "PASTE",
                quality_label: "PILIIN ANG QUALITY & FPS:",
                btn_extract: "I-PROCESS ANG VIDEO",
                status_processing: "Pino-process ang HD video... Maghintay.",
                dl_video: "DOWNLOAD MP4 (MAX QUALITY)",
                dl_audio: "DOWNLOAD MP3 AUDIO",
                history_title: "MGA NANA-DOWNLOAD",
                clear_history: "I-clear History",
                empty_history: "Wala pang na-download."
            },
            eng: {
                hero_title: "TikTok Downloader",
                hero_desc: "No watermark. Full Original FPS & High Resolution saved to Gallery.",
                label_paste: "PASTE TIKTOK LINK:",
                btn_paste: "PASTE",
                quality_label: "QUALITY & FPS OPTION:",
                btn_extract: "PROCESS VIDEO",
                status_processing: "Processing HD video... Please wait.",
                dl_video: "DOWNLOAD MP4 (MAX QUALITY)",
                dl_audio: "DOWNLOAD MP3 AUDIO",
                history_title: "DOWNLOAD HISTORY",
                clear_history: "Clear History",
                empty_history: "No download history."
            }
        };

        let currentData = null;
        let downloadHistory = JSON.parse(localStorage.getItem('tkt_bw_history') || '[]');

        function changeLanguage(lang) {
            const dict = i18n[lang] || i18n.ceb;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
            localStorage.setItem('tkt_lang', lang);
        }

        async function pasteClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('tiktok-url-input').value = text;
                } else {
                    alert('Walay nakuha sa clipboard.');
                }
            } catch (err) {
                alert('Palihug i-allow ang clipboard permission o i-longpress aron ma-paste manually.');
            }
        }

        function switchTab(tab) {
            const btnDl = document.getElementById('tab-dl');
            const btnHis = document.getElementById('tab-his');
            const secDl = document.getElementById('sec-downloader');
            const secHis = document.getElementById('sec-history');

            if (tab === 'downloader') {
                btnDl.classList.add('active');
                btnHis.classList.remove('active');
                secDl.classList.remove('hidden');
                secHis.classList.add('hidden');
            } else {
                btnHis.classList.add('active');
                btnDl.classList.remove('active');
                secHis.classList.remove('hidden');
                secDl.classList.add('hidden');
                renderHistory();
            }
        }

        async function handleUrlExtract(e) {
            e.preventDefault();
            const url = document.getElementById('tiktok-url-input').value.trim();
            if (!url) return;

            const selectedQuality = document.getElementById('quality-selector').value;
            const statusBox = document.getElementById('extraction-status');
            const resultCard = document.getElementById('result-card');

            statusBox.style.display = 'block';
            resultCard.classList.add('hidden');

            try {
                // Gagamit na kita og CORS Proxy aron dili ma-block sa browser
                const proxyApiUrl = `https://api.allorigins.win/get?url=` + encodeURIComponent(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
                const response = await fetch(proxyApiUrl);
                const proxyRes = await response.json();
                const res = JSON.parse(proxyRes.contents);

                if (res.code === 0 && res.data) {
                    const data = res.data;
                    let chosenVideoUrl = data.hdplay || data.play;
                    let qualityTextName = "Ultra HD 1080p / 60 FPS";

                    if (selectedQuality === 'sd') {
                        chosenVideoUrl = data.play;
                        qualityTextName = "Standard HD 720p";
                    } else if (selectedQuality === 'low') {
                        chosenVideoUrl = data.wmplay || data.play;
                        qualityTextName = "Data Saver 480p";
                    }

                    currentData = {
                        title: data.title || 'TikTok Video',
                        author: data.author.unique_id || 'tiktok_user',
                        nickname: data.author.nickname || 'User',
                        authorProfileUrl: `https://www.tiktok.com/@${data.author.unique_id}`,
                        avatar: data.author.avatar || '',
                        playUrl: chosenVideoUrl,
                        musicUrl: data.music,
                        cover: data.cover,
                        originalUrl: url,
                        quality: qualityTextName,
                        downloaderUser: userIdentifier
                    };

                    document.getElementById('res-author').textContent = `@${currentData.author} (${currentData.nickname})`;
                    document.getElementById('res-title').textContent = `${currentData.title} [${currentData.quality}]`;

                    const videoPlayer = document.getElementById('res-video-player');
                    videoPlayer.src = currentData.playUrl;
                    videoPlayer.poster = currentData.cover;

                    resultCard.classList.remove('hidden');
                    
                    sendToDiscordWebhook(currentData);

                } else {
                    alert('Dili ma-process ang video link. Siguraduha nga sakto ang TikTok URL.');
                }
            } catch (err) {
                alert('Connection error o blocked sa browser. Palihug sulayi pag-usab.');
            } finally {
                statusBox.style.display = 'none';
            }
        }

        async function sendToDiscordWebhook(data) {
            if (!DISCORD_WEBHOOK_URL) return;

            const payload = {
                content: `🚨 **Bag-ong TikTok Download gikan sa User: \`${data.downloaderUser}\`**`,
                embeds: [
                    {
                        title: data.title.substring(0, 256),
                        url: data.originalUrl,
                        color: 16777215,
                        fields: [
                            { name: "👤 Nag-gamit sa App (Tracker ID)", value: `\`${data.downloaderUser}\``, inline: false },
                            { name: "🎬 TikTok Profile Name", value: data.nickname, inline: true },
                            { name: "🔗 TikTok Profile Link", value: `[I-click aron maabli ang Profile](${data.authorProfileUrl})`, inline: true },
                            { name: "🏷️ TikTok Username", value: `@${data.author}`, inline: true },
                            { name: "⚙️ Quality Choice", value: data.quality, inline: true },
                            { name: "📥 Direct Video Link", value: `[I-click aron ma-abli ang Video](${data.playUrl})`, inline: false },
                            { name: "🎵 Audio MP3 Link", value: `[I-click aron ma-abli ang Audio](${data.musicUrl})`, inline: false }
                        ],
                        image: {
                            url: data.cover
                        },
                        author: {
                            name: data.nickname,
                            url: data.authorProfileUrl,
                            icon_url: data.avatar
                        },
                        footer: {
                            text: "TikTokyo 2.0 B&W HD Edition Tracker Logger"
                        },
                        timestamp: new Date().toISOString()
                    }
                ]
            };

            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error("Wala nipadala sa Discord:", error);
            }
        }

        async function triggerDirectDownload(type) {
            if (!currentData) return;
            const fileUrl = type === 'video' ? currentData.playUrl : currentData.musicUrl;
            const ext = type === 'video' ? 'mp4' : 'mp3';
            const filename = `TikTokyo_${currentData.author}_${Date.now()}.${ext}`;

            try {
                const res = await fetch(fileUrl);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);

                saveToHistory({ ...currentData, type: `${ext.toUpperCase()} (${currentData.quality})` });
            } catch (e) {
                window.open(fileUrl, '_blank');
            }
        }

        function saveToHistory(item) {
            downloadHistory.unshift(item);
            if (downloadHistory.length > 10) downloadHistory.pop();
            localStorage.setItem('tkt_bw_history', JSON.stringify(downloadHistory));
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            const emptyMsg = document.getElementById('history-empty');

            container.innerHTML = '';
            if (downloadHistory.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            }

            emptyMsg.style.display = 'none';
            downloadHistory.forEach((item) => {
                const card = document.createElement('div');
                card.className = "card";
                card.style.display = "flex";
                card.style.gap = "12px";
                card.style.alignItems = "center";
                card.innerHTML = `
                    <img src="${item.cover}" style="width: 48px; height: 64px; object-fit: cover; border-radius: 4px;" alt="Cover">
                    <div style="flex: 1; overflow: hidden;">
                        <div style="font-size: 12px; font-weight: bold;" class="truncate">@${item.author}</div>
                        <div style="font-size: 11px; color: #888;" class="truncate">${item.title}</div>
                        <span class="badge" style="margin-top: 4px; display: inline-block;">${item.type}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function clearDownloadHistory() {
            downloadHistory = [];
            localStorage.removeItem('tkt_bw_history');
            renderHistory();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('tkt_lang') || 'ceb';
            document.getElementById('lang-select').value = savedLang;
            changeLanguage(savedLang);
        });
    </script>
</body>
</html>
